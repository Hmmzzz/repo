name: Publish APT repository

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish.yml"
      - "changelogs.json"
      - "pool/**"
      - "packages/**"
      - "scripts/**"
      - "site/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Install repository tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes apt-utils dpkg-dev zstd

      - name: Build and verify APT repository
        id: build
        shell: bash
        run: |
          publish_dir=$(mktemp -d "$RUNNER_TEMP/hmmzzz-repo.XXXXXX")
          ./scripts/build-repo.sh "$publish_dir"
          ./scripts/smoke-test.sh "$publish_dir"
          echo "path=$publish_dir" >> "$GITHUB_OUTPUT"

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ steps.build.outputs.path }}

  deploy:
    name: Deploy GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
